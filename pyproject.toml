[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translator"
version = "0.1.0"
description = "Traduce PDFs (papers) preservando layout, imágenes y fórmulas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pymupdf>=1.26",
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
pdf-translate = "pdf_translator.cli:main"
pdf-translate-web = "pdf_translator.web:main"

[tool.setuptools.packages.find]
include = ["pdf_translator*"]

[tool.setuptools.package-data]
pdf_translator = ["static/*.html"]
